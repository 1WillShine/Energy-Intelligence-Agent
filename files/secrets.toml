# .streamlit/secrets.toml
# Add your API keys here BEFORE deploying to Streamlit Cloud
# Streamlit Cloud encrypts this file — your mentor never sees the keys
# DO NOT commit this file to GitHub — add to .gitignore

GROQ_API_KEY      = "your-groq-key-here"
GEMINI_API_KEY    = "your-gemini-key-here"
ANTHROPIC_API_KEY = "your-anthropic-key-here"

# Set default provider so mentor doesn't need to configure anything
DEFAULT_AI_PROVIDER = "Groq (Free)"
